name: aarogya_plus
description: "AarogyaPlus - Premium Telemedicine Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.5
  cloud_functions: ^5.3.4
  firebase_messaging: ^15.2.4

  # Google Sign-In
  google_sign_in: ^6.2.2

  # UI / Design
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.3.1
  file_picker: ^8.1.7
  uuid: ^4.5.1
  timeago: ^3.7.0

  # Icons
  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.2

  # Video Calling
  agora_rtc_engine: ^6.5.3
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.4
  build_runner: ^2.4.14

flutter:
  uses-material-design: true
